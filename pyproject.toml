[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mic-50-90"
version = "1.0.3"
description = "A Python package for bounding MIC distributions from incomplete susceptibility reports"
readme = "README.md"
requires-python = ">=3.11"
# SPDX licence metadata; the full licence is included below.
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
  {name = "Maciej Kochanowski", email = "maciej.kochanowski@piwet.pulawy.pl"}
]
keywords = ["minimum inhibitory concentration", "MIC50", "MIC90", "antimicrobial susceptibility reporting", "antimicrobial resistance", "partial identification", "surveillance"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Typing :: Typed"
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.13"
]

[project.optional-dependencies]
benchmark = [
  "openpyxl>=3.1",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "nbformat>=5.10",
  "nbclient>=0.10",
  "ipykernel>=6.29",
  "duckdb>=1.1",
  "pyarrow>=17",
  "curl-cffi>=0.7",
  "lxml>=5.3",
  "python-docx>=1.1"
]
test = [
  # Packaging regressions exercise the actual source-distribution backend.
  "hatchling>=1.27",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "hypothesis>=6.110",
  "jsonschema>=4.22",
  # External-data loader tests import these dependencies.
  "duckdb>=1.1",
  "pandas>=2.2"
]
all = [
  "mic-50-90[benchmark,test]"
]

[project.urls]
Documentation = "https://github.com/maciejkochanowski/mic-50-90/blob/main/docs/GUI_GUIDE.md"
Homepage = "https://github.com/maciejkochanowski/mic-50-90"
Repository = "https://github.com/maciejkochanowski/mic-50-90"
Issues = "https://github.com/maciejkochanowski/mic-50-90/issues"

[project.scripts]
mic-50-90 = "mic_50_90.cli:main"

[project.gui-scripts]
mic-50-90-gui = "mic_50_90.gui:main"

[tool.hatch.build]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.wheel]
packages = ["src/mic_50_90"]

[tool.hatch.build.targets.sdist]
include = [
  "/hatch_build.py",
  "/PACKAGE_STATUS.json",
  "/src",
  "/tests",
  "/formal",
  "/schemas",
  "/examples",
  "/evaluation",
  "/docs",
  "/data/LICENSES.md",
  "/data/SOURCES.md",
  "/README.md",
  "/LICENSE.txt",
  "/CITATION.cff",
  "/CHANGELOG.md",
  "/README_REVIEWER.md",
  "/NOTICE.md",
  "/codemeta.json",
  "/.zenodo.json",
  "/scripts",
  "/tools",
  "/.github/workflows",
  "/reproducibility/joint-distribution/oracle.py",
  "/reproducibility/self_test.py",
  "/reproducibility/joint-distribution/production_adapter.py",
  "/pyproject.toml",
]
exclude = ["**/__pycache__", "**/*.pyc", "/PACKAGE_MANIFEST.sha256", "/MANIFEST.sha256"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
# Tests import the installed package without a source-path override.

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src/mic_50_90"]

# SciPy ships without type information.
[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["mic_50_90"]

[tool.coverage.report]
show_missing = true
skip_covered = false

# Targeted mutation testing of thirteen critical functions (evaluation/README.md, "Tests, coverage and mutations").
[tool.mutmut]
paths_to_mutate = ["src/mic_50_90/range_certificates.py", "src/mic_50_90/decisions.py", "src/mic_50_90/utility.py",
  "src/mic_50_90/validation.py", "src/mic_50_90/count_updates.py", "src/mic_50_90/joint_population.py",
  "src/mic_50_90/range_population.py", "src/mic_50_90/exact_population.py", "src/mic_50_90/sufficient_reporting.py",
  "src/mic_50_90/conformal.py", "src/mic_50_90/dro.py"]
tests_dir = ["tests/"]
also_copy = [".github/", ".gitignore", ".gitattributes", ".dockerignore", "examples/", "schemas/", "reproducibility/", "docs/", "scripts/", "tools/", "src/", "evaluation/", "formal/", "data/", "README.md", "CITATION.cff", "codemeta.json", ".zenodo.json", "PACKAGE_STATUS.json", "PACKAGE_MANIFEST.sha256", "LICENSE.txt", "NOTICE.md", "CHANGELOG.md", "README_REVIEWER.md", "DELIVERY.md", "SECURITY.md", "CONTRIBUTING.md", "uv.lock", "Dockerfile", "verify.sh"]
