name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build
      - name: Build distributions
        run: python -m build
      - name: Install and exercise wheel and source archive outside checkout
        run: python scripts/check_release_archives.py dist --receipt archive-check.json
      - name: Test the installed wheel
        shell: bash
        run: |
          python -m pip install "$(find dist -name '*.whl' -print -quit)[test]"
          python -m pytest --cov=mic_50_90 --cov-report=term-missing --cov-report=xml
      - name: Test form model
        run: node --test "tests/*.cjs"
      - name: Exercise saved options in the real browser
        if: matrix.python-version == '3.12'
        run: |
          npm install --no-save playwright
          npx playwright install chromium
          python tools/check_browser.py --output browser-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            archive-check.json
            coverage.xml
            browser-check/REOPENED_OPTIONS.json
