name: Build and publish software

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag matching the declared package version (optionally with a release label)
        required: true
        type: string
        default: v1.0.2
      publish_github:
        description: Explicitly approve publishing the verified candidate on GitHub
        required: true
        type: boolean
        default: false
      publish_pypi:
        description: Publish to PyPI using an already configured trusted publisher
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: software-release-${{ inputs.release_tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  test:
    needs: packages
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: software-packages
          path: candidate
      - run: python -m pip install "$(find candidate -name '*.whl' -print -quit)[test]"
      - name: Test Python behaviour
        run: python tools/run_test_evidence.py run --wheel "$(find candidate -name '*.whl' -print -quit)" --commit "$GITHUB_SHA" --manifest candidate/expected-tests.json --junit test-results.xml
      - name: Test form behaviour
        run: node --test "tests/*.cjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}-${{ matrix.python }}
          overwrite: true
          path: |
            test-results.xml
            test-results.runtime.json
          if-no-files-found: error

  packages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - name: Build and inspect distributions
        run: |
          python -c 'import os, sys; sys.path.insert(0, "tools"); from publish_software_release import validate_tag; validate_tag(os.environ["RELEASE_TAG"])'
          python -m build --outdir release
          python -m twine check --strict release/*
          python tools/software_release.py source --output "release/MIC-50-90-$(python tools/release_version.py)-software-source.zip"
          python tools/software_release.py check release/*
      - name: Independently collect the complete expected suite
        run: |
          python -m pip install "$(find release -name '*.whl' -print -quit)[test]"
          python tools/run_test_evidence.py collect --wheel "$(find release -name '*.whl' -print -quit)" --commit "$GITHUB_SHA" --output release/expected-tests.json
      - name: Install both distributions outside the checkout
        run: python scripts/check_release_archives.py release --receipt release/CLI-install-check.json
      - name: Build and smoke-test the optional Docker environment
        run: |
          export MIC50_90_IMAGE="mic-50-90:$(python tools/release_version.py)"
          docker build -t "$MIC50_90_IMAGE" .
          docker run --rm "$MIC50_90_IMAGE" bash -euo pipefail -c 'node --version; uv pip check; python reproducibility/self_test.py; python scripts/refresh_package_manifest.py --check'
          python -c 'import json, os; from pathlib import Path; Path("release/Docker-runtime-check.json").write_text(json.dumps({"status": "passed", "source_commit": os.environ["GITHUB_SHA"], "image": os.environ["MIC50_90_IMAGE"], "checks": ["node", "dependencies", "offline_self_test", "source_manifest"]}, indent=2) + "\n", encoding="utf-8")'
      - uses: actions/upload-artifact@v4
        with:
          name: software-packages
          overwrite: true
          path: release/*
          if-no-files-found: error

  windows:
    needs: packages
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: software-packages
          path: candidate
      - run: python -m pip install "$(find candidate -name '*.whl' -print -quit)" pyinstaller
      - name: Build Windows application
        run: python tools/build_windows.py --output windows-build
      - name: Run the packaged application and compare it with CLI
        run: python tools/check_windows_release.py --application windows-build/application/MIC-50-90/MIC-50-90.exe --receipt release/Windows-runtime-check.json
      - run: npm install --no-save playwright
      - run: npx playwright install chromium
      - name: Test the packaged form in Chromium
        run: |
          python tools/check_browser.py --application windows-build/application/MIC-50-90/MIC-50-90.exe --output browser-check/reopened
          python tools/check_browser.py --acceptance --application windows-build/application/MIC-50-90/MIC-50-90.exe --output browser-check/acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-browser-diagnostics
          path: browser-check/
      - name: Package the tested Windows application
        run: python tools/software_release.py windows --application windows-build/application/MIC-50-90 --output "release/MIC-50-90-$(python tools/release_version.py)-Windows-x64.zip"
      - name: Include Windows verification receipts
        run: |
          cp windows-build/BUILD_RECEIPT.json release/Windows-build-receipt.json
          cp browser-check/reopened/REOPENED_OPTIONS.json release/Windows-browser-check.json
          cp browser-check/acceptance/ACCEPTANCE_BROWSER.json release/Windows-browser-acceptance.json
      - uses: actions/upload-artifact@v4
        with:
          name: software-windows
          overwrite: true
          path: release/*
          if-no-files-found: error

  verify:
    needs: [test, packages, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: software-packages
          path: packages
      - uses: actions/download-artifact@v4
        with:
          pattern: verification-*
          path: verification
      - run: python tools/check_release_tests.py verification --manifest packages/expected-tests.json --commit "$GITHUB_SHA" --receipt TEST_MATRIX_VERIFICATION.json
      - uses: actions/upload-artifact@v4
        with:
          name: matrix-verification
          path: TEST_MATRIX_VERIFICATION.json
          if-no-files-found: error

  publish:
    needs: [test, packages, windows, verify]
    if: inputs.publish_github && github.ref == 'refs/heads/main'
    environment: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: software-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: verification-*
          path: verification
      - name: Record tests and inspect the complete release
        run: |
          python tools/check_release_tests.py verification --manifest release/expected-tests.json --commit "$GITHUB_SHA" --receipt release/TEST_MATRIX_VERIFICATION.json
          python -c 'import sys; from pathlib import Path; sys.path.insert(0, "tools"); from publish_software_release import pack_test_evidence; pack_test_evidence(Path("verification"), Path("release/Software-test-results.zip"))'
          python tools/software_release.py manifest --directory release --commit "$GITHUB_SHA" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Publish verified assets using the Actions token
        env:
          GH_TOKEN: ${{ github.token }}
          MIC50_90_PUBLISH_APPROVED: 'true'
        run: python tools/publish_software_release.py --directory release --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification
          overwrite: true
          path: |
            release/SOFTWARE_MANIFEST.json
            release/SHA256SUMS.txt
            RELEASE_PUBLICATION.json

  pypi:
    needs: publish
    if: inputs.publish_github && inputs.publish_pypi && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: software-packages
          path: packages
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select Python distributions
        run: |
          mkdir dist
          cp packages/*.whl packages/*.tar.gz dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  container:
    needs: publish
    if: inputs.publish_github && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
    with:
      release_tag: ${{ inputs.release_tag }}
