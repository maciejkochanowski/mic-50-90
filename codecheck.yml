%YAML 1.1
---
version: https://codecheck.org.uk/spec/config/1.0/

# Recreate the outputs from the repository root with the commands in figures/README.md:
#   python -m venv fig-env
#   fig-env/bin/pip install -r figures/requirements-figures.txt
#   fig-env/bin/pip install --no-deps .
#   fig-env/bin/python figures/build_main_figures.py --out new-figures/main --check figures/EXPECTED_MAIN_FIGURES.json
#   fig-env/bin/python figures/build_appendix_figures.py --out new-figures/appendix --check figures/EXPECTED_APPENDIX_FIGURES.json
# Each command ends with "identical_to_recorded_figures": true when every file matches the recorded figures.

